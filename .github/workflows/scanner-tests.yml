name: Validate NSE full-market scanner
on:
  push:
    paths:
      - "full_market_scanner.py"
      - "scanner_ui.py"
      - "test_full_market_scanner.py"
      - "requirements.txt"
      - ".github/workflows/scanner-tests.yml"
  pull_request:
    paths:
      - "full_market_scanner.py"
      - "scanner_ui.py"
      - "test_full_market_scanner.py"
      - "requirements.txt"
      - ".github/workflows/scanner-tests.yml"
  workflow_dispatch:
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validated dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2,<3"
      - name: Compile scanner source
        run: python -m py_compile full_market_scanner.py scanner_ui.py web_dashboard.py
      - name: Offline regression
        run: python -m unittest -v test_full_market_scanner
