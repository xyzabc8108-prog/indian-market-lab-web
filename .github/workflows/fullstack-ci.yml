name: Modular Fullstack API checks
on:
  push:
    paths:
      - 'fullstack/**'
      - 'render.yaml'
      - 'research_engine.py'
      - 'news_radar.py'
      - 'market_universe.py'
      - 'full_market_scanner.py'
      - '.github/workflows/fullstack-ci.yml'
  pull_request:
    paths:
      - 'fullstack/**'
      - 'render.yaml'
      - 'research_engine.py'
      - 'news_radar.py'
      - 'market_universe.py'
      - 'full_market_scanner.py'
      - '.github/workflows/fullstack-ci.yml'
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r fullstack/backend/requirements.txt pytest httpx
      - run: python -m pytest -q fullstack/backend/tests/test_api.py fullstack/backend/tests/test_beta.py fullstack/backend/tests/test_terminal.py fullstack/backend/tests/test_legal.py
      - run: |
          for f in fullstack/frontend/app.js fullstack/frontend/api.js fullstack/frontend/pages/*.js fullstack/frontend/beta.js fullstack/frontend/terminal.js; do node --check "$f"; done
